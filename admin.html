<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إيموزار إكسبريس</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-top: 30px; }
        h2 { text-align: center; color: #f59e0b; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; color: #cbd5e1; }
        input, textarea { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #f59e0b; color: #000; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 5px; margin-top: 20px; cursor: pointer; }
        button:hover { background: #d97706; }
        .setup-box { background: #334155; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 13px; color: #94a3b8; }
        .forgot-btn { background: transparent; color: #38bdf8; border: none; margin-top: 10px; cursor: pointer; font-size: 14px; text-decoration: underline; width: 100%; text-align: center; }
        .forgot-btn:hover { color: #0ea5e9; }
    </style>
</head>
<body>

<!-- قسم تسجيل الدخول -->
<div class="container" id="loginSection">
    <h2>تسجيل دخول الأدمن</h2>
    <div class="setup-box">
        أدخل كلمة المرور الخاصة لوحة التحكم أو رمز GitHub Token للربط المباشر:
    </div>
    <label for="adminPassword">كلمة المرور أو الرمز:</label>
    <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور هنا">
    
    <button onclick="checkLogin()">دخول لوحة التحكم</button>
    <button class="forgot-btn" onclick="recoverPassword()">نسيت كلمة المرور؟ (إرسال للبريد والهاتف)</button>
    <p id="loginMsg" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
</div>

<!-- قسم لوحة التحكم ونشر الأخبار -->
<div class="container" id="adminSection" style="display: none;">
    <h2>إضافة خبر جديد</h2>
    
    <label for="ghTokenInput">رمز GitHub Token (لأول مرة فقط إذا لم تقم بحفظه):</label>
    <input type="password" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxxxx">

    <label for="newsTitle">عنوان الخبر:</label>
    <input type="text" id="newsTitle" placeholder="أدخل عنوان الخبر الرئيسي">

    <label for="newsCategory">التصنيف:</label>
    <input type="text" id="newsCategory" value="متابعات إيموزار كندر والإقليم">

    <label for="newsContent">محتوى الخبر:</label>
    <textarea id="newsContent" rows="6" placeholder="اكتب تفاصيل الخبر هنا..."></textarea
